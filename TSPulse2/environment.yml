name: tsb-ad-env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # --- Core Environment ---
  - python=3.11
  - pip

  # --- Core & Common Dependencies (Managed by Conda) ---
  - pandas>=2.2.0
  - numpy>=1.24.3,<2.0
  - scikit-learn>=1.3.2
  - transformers>=4.38.0
  - datasets
  - deprecated
  - urllib3>=1.26.19
  - cython>=3.0.10
  - matplotlib>=3.7.5
  - h5py
  - einops
  - tqdm
  - torchinfo
  - tslearn>=0.6.3
  - stumpy>=1.12.0
  - networkx>=3.1
  - statsmodels
  - accelerate>=0.26.0

  # --- Development & Notebook Dependencies (Managed by Conda) ---
  - black
  - ruff==0.5.7
  - pytest
  - parameterized # pytest-cov is now in pip section
  - pre-commit
  - jupyter
  - ipython
  - ipywidgets
  - plotly
  - tensorboard
  - rich
  - joblib
  - python-dotenv
  - xgboost
  - catboost

  # --- Pip-managed dependencies ---
  # PyTorch stack is handled by pip to ensure the specific cu126 build is used, as intended.
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu126
    - torch==2.8.0
    - torchvision
    - torchaudio
    - google-genai
    - pytest-cov
    - kaleido
    - arch>=5.3.1
    - hurst>=0.0.5
