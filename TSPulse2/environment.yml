name: tsb-ad-env
channels:
  - pytorch
  - nvidia
  - conda-forge # Prioritizing conda-forge for broader package availability
  - defaults
dependencies:
  # --- Core Environment ---
  - python=3.11
  - pip

  # --- Data Science & ML Stack (from both files) ---
  - numpy>=1.24.3,<2.0
  - pandas>=2.0.3
  - scikit-learn>=1.3.2
  - cython>=3.0.10
  - matplotlib>=3.7.5
  - h5py
  - datasets
  - xgboost
  - catboost
  - tslearn>=0.6.3
  - stumpy>=1.12.0
  
  # --- ML/DL Utility Libraries ---
  - tqdm
  - torchinfo
  - einops
  - networkx>=3.1
  - transformers>=4.38.0
  - accelerate>=0.26.0

  # --- Niche & Statistical Libraries ---
  - arch>=5.3.1
  - hurst>=0.0.5
  
  # --- Developer Experience ---
  - black
  - ipython
  - rich
  - joblib
  - python-dotenv

  # --- Pip-managed dependencies ---
  # PyTorch stack is handled by pip to ensure the specific cu126 build is used.
  - pip:
    - --index-url https://download.pytorch.org/whl/cu126
    - torch==2.8.0
    - torchvision
    - torchaudio
    - google-genai
