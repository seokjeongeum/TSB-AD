name: tsb-ad-env
channels:
  - pytorch
  - nvidia
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - black
  - pip
  - pytorch=2.3.0
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8 # Ensures PyTorch uses the correct CUDA version
  - scikit-learn>=1.3.2
  - cython>=3.0.10
  - pandas>=2.0.3
  - numpy>=1.24.3
  - datasets
  - ipython
  - rich
  - joblib
  - xgboost
  - catboost
  - python-dotenv
  - pip:
    - google-genai
    # Maintained from original yml
    - -r ../requirements.txt # Use ../ to go one directory up